name: Supabase Database Sync

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  sync-database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Cần token có quyền push code lại vào repo nếu có thay đổi (types generated)
          # Mặc định GITHUB_TOKEN đã đủ quyền push nếu được config trong settings
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Migrations to Supabase Cloud
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Error: Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID secrets."
            exit 1
          fi
          supabase link --project-ref $SUPABASE_PROJECT_ID --password "" || true
          supabase db push --include-all --yes

      - name: Generate TypeScript Types
        run: |
          supabase gen types typescript --project-id $SUPABASE_PROJECT_ID > src/types/database.ts

      - name: Commit and Push Updated Types
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes in the types file
          if [[ -n $(git status --porcelain src/types/database.ts) ]]; then
            git add src/types/database.ts
            git commit -m "chore(db): auto-sync typescript types from cloud [skip ci]"
            git push
            echo "Types updated and pushed."
          else
            echo "No changes in database types."
          fi
